/* ---- touch, iPhone & iPad ---- */

body{min-height:100dvh;-webkit-tap-highlight-color:transparent;background:#deded5}

  .toggles input{width:20px;height:20px}
}
@media(display-mode:standalone){.hint.touch{display:none!important}}
@media(prefers-reduced-motion:reduce){.progress span,.physical{transition:none}}

/* iPad portrait: centre the device on the screen */
@media(min-width:700px) and (orientation:portrait){
  .page{min-height:100dvh;display:flex;flex-direction:column;justify-content:center}
  .instrument{width:100%}

  .time{height:auto;padding:14px 0 12px}

function tint(hex,target,amount){return '#'+hex.slice(1).match(/../g).map(v=>Math.round(parseInt(v,16)*(1-amount)+target*amount).toString(16).padStart(2,'0')).join('')}
function applyColors(){const lcd=config[config.sessionColors?(mode==='focus'?'focusColor':mode==='short'?'shortColor':'longColor'):'focusColor'];const style=document.body.style;style.setProperty('--lcd',lcd);style.setProperty('--ink',readableInk(lcd));style.setProperty('--accent',config.accentColor);style.setProperty('--accent-ink',readableInk(config.accentColor));style.setProperty('--accent-shadow',tint(config.accentColor,0,.32));style.setProperty('--accent-border',tint(config.accentColor,0,.27));style.setProperty('--accent-light',tint(config.accentColor,255,.35));}
function syncFields(){for(const k of ['focus','short','long','theme',...colorKeys])$(k).value=config[k];for(const k of ['sound','auto','sessionColors'])$(k).checked=config[k];document.body.dataset.theme=config.theme;document.querySelector('.legend b').textContent=`POMODORO / ${config.focus}–${config.short}`}function draw(){applyColors();let seconds=Math.ceil(remaining);let value=String(Math.floor(seconds/60)).padStart(2,'0')+':'+String(seconds%60).padStart(2,'0');$('time-text').textContent=value;renderPixels(value);document.title=value+' / '+names[mode].toLowerCase()+' · tempo';$('mode-name').textContent=names[mode];$('cycle').textContent=String(round).padStart(2,'0')+' / 04';$('status').textContent=running?'RUNNING':started?'PAUSED':'READY';$('toggle').textContent=running?'PAUSE':started?'RESUME':'START';$('session-label').textContent=mode==='focus'?(running?'ONE THING AT A TIME':'TIME TO SETTLE IN'):'STEP AWAY. BREATHE.';$('progress').style.width=Math.max(0,Math.min(100,remaining/(config[mode]*60)*100))+'%';document.body.classList.toggle('running',running);document.querySelectorAll('[data-mode]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.mode===mode)))}function chime(){if(!config.sound)return;try{audio ||= new(window.AudioContext||window.webkitAudioContext)();audio.resume();for(let i=0;i<3;i++){let o=audio.createOscillator(),g=audio.createGain(),t=audio.currentTime+i*.22;o.connect(g);g.connect(audio.destination);o.frequency.value=i===2?880:660;g.gain.setValueAtTime(.12,t);g.gain.exponentialRampToValueAtTime(.001,t+.4);o.start(t);o.stop(t+.4)}}catch{}}function unlock(){try{audio ||=new(window.AudioContext||window.webkitAudioContext)();audio.resume()}catch{}}function start(){unlock();running=true;started=true;end=Date.now()+remaining*1000;draw()}function stop(){if(running)remaining=Math.max(0,(end-Date.now())/1000);running=false;draw()}function choose(next){running=false;started=false;mode=next;remaining=config[mode]*60;draw()}function advance(completed=false){if(mode==='focus'){choose(round===4?'long':'short')}else{round=mode==='long'?1:Math.min(4,round+1);choose('focus')}if(completed&&config.auto)start()}function tick(){if(running){remaining=Math.max(0,(end-Date.now())/1000);if(remaining===0){running=false;chime();advance(true);$('notice').textContent='Session complete. '+names[mode].toLowerCase()+' is next.'}draw()}const now=new Date();$('date').textContent=now.toLocaleDateString('en-US',{weekday:'short'}).toUpperCase()+' '+String(now.getMonth()+1).padStart(2,'0')+'–'+String(now.getDate()).padStart(2,'0')+'–'+now.getFullYear();$('date').dateTime=now.toISOString();$('clock').textContent=now.toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit',hour12:false});$('clock').dateTime=now.toISOString()}
$('toggle').onclick=()=>{running?stop():start();$('notice').textContent=''};$('reset').onclick=()=>{choose(mode);$('notice').textContent='Session reset.'};$('next').onclick=()=>{advance();$('notice').textContent='Next session ready.'};document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{choose(b.dataset.mode);$('notice').textContent=''});$('theme').onchange=()=>{const palette=presets[$('theme').value];for(const k of colorKeys)$(k).value=palette[k]};$('settings').onsubmit=e=>{e.preventDefault();if(!$('settings').reportValidity())return;const old=config[mode];for(const k of ['focus','short','long'])config[k]=Number($(k).value);config.theme=$('theme').value;for(const k of colorKeys)config[k]=$(k).value;config.sessionColors=$('sessionColors').checked;config.sound=$('sound').checked;config.auto=$('auto').checked;let saved=true;try{localStorage.setItem('tempo-settings',JSON.stringify(config))}catch{saved=false}syncFields();if(old!==config[mode])choose(mode);else draw();$('notice').textContent=saved?'':'Preferences applied for this visit.';};document.addEventListener('keydown',e=>{if(e.key==='Escape'&&immersive){e.preventDefault();setImmersive(false);if(document.fullscreenElement)document.exitFullscreen().catch(()=>{});requestedFullscreen=false;return}if(e.repeat||e.ctrlKey||e.metaKey||e.altKey||/INPUT|SELECT|TEXTAREA|BUTTON|SUMMARY/.test(e.target.tagName))return;if(e.code==='Space'){e.preventDefault();$('toggle').click()}else if(e.key.toLowerCase()==='r')$('reset').click();else if(e.key.toLowerCase()==='n')$('next').click();else if(e.key.toLowerCase()==='f')toggleFullscreen()});document.addEventListener('visibilitychange',tick);
document.addEventListener('touchstart',()=>{},{passive:true});
let wakeLock=null;async function holdWake(){try{if(running&&'wakeLock'in navigator&&!wakeLock&&document.visibilityState==='visible'){wakeLock=await navigator.wakeLock.request('screen');wakeLock.addEventListener('release',()=>{wakeLock=null})}}catch{}}
function dropWake(){try{wakeLock&&wakeLock.release()}catch{}wakeLock=null}
const _draw=draw;draw=function(){_draw();running?holdWake():dropWake()};
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')holdWake()});
if(!document.documentElement.requestFullscreen&&!document.documentElement.webkitRequestFullscreen){fullscreenButton.dataset.focusOnly='1'}
syncFields();draw();tick();setInterval(tick,200);})();
</script></body></html>
